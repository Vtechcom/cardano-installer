# Cargo.toml

[package]
name = "cardano-installer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
license-file = "LICENSE"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "2.2.0"
dialoguer = "0.12.0"
indicatif = "0.18.3"
which = "8.0.0"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9.33"
reqwest = { version = "0.12.24", features = ["blocking", "json"] }
anyhow = "1"
thiserror = "2.0.17"
dirs = "6.0.0"
tar = "0.4.44"
flate2 = "1.1.7"
